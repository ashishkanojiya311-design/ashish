[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-statement-converter"
version = "0.1.0"
description = "Convert bank statement PDFs into normalized Excel files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Bank Statement Converter Contributors" }
]
dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.10.0",
  "camelot-py[cv]>=0.11.0",
  "pytesseract>=0.3.10",
  "pdf2image>=1.16.3",
  "python-dateutil>=2.8.2"
]

[project.scripts]
bank-statement-converter = "bank_statement_converter.cli:main"

[tool.setuptools]
packages = ["bank_statement_converter"]
